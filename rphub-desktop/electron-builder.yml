appId: com.rphub.desktop
productName: Roleplay Hub
directories:
  output: release
files:
  - out/**/*
  - "!node_modules/**/*"
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
linux:
  target:
    - AppImage
    - deb
  icon: build/
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
